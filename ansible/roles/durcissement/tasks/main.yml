---
# tasks file for roles/durcissement
- name: Paquets de sécurité
  ansible.builtin.apt:
    name: [ufw, fail2ban, unattended-upgrades]
    state: present

- name: Ufw, refus par défaut en entrée
  community.general.ufw:
    default: deny
    direction: incoming

# Les ports viennent de group_vars/all/vars.yml (ufw_regles).
# Serveur absent de la liste : SSH seul, pour ne jamais se couper l'accès.
- name: Ufw, ports autorisés
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: tcp
    from_ip: "{{ item.source | default('any') }}"
  loop: "{{ ufw_regles[inventory_hostname] | default([{'port': '22'}]) }}"

- name: Ufw activé
  community.general.ufw:
    state: enabled

- name: Fail2ban actif
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Mises à jour automatiques de sécurité
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
