---
# tasks file for roles/ssh
- name: Configuration SSH durcie
  ansible.builtin.template:
    src: durcissement.conf.j2
    dest: /etc/ssh/sshd_config.d/durcissement.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Recharger ssh
