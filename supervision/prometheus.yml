global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: linux
    static_configs:
      - targets: ["srv-adm01.pme.lan:9100", "srv-web01.pme.lan:9100"]

  - job_name: windows
    static_configs:
      - targets: ["srv-dc01.pme.lan:9182"]
